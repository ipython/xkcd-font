name: Font preview link

on:
  # pull_request_target is required so fork PRs get a writable commit status.
  # This job never checks out or executes PR code; it only reads the head SHA
  # and posts a status, so the usual pull_request_target risks do not apply.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [master]

jobs:
  preview-link:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post font preview link
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          sha="$HEAD_SHA"
          font_url="https://raw.githubusercontent.com/${REPO}/${sha}/xkcd-script/font/xkcd-script.woff"
          encoded=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$font_url")
          gh api "repos/${REPO}/statuses/${sha}" \
            -f state=success \
            -f target_url="https://ipython.org/xkcd-font/xkcd-script/?font=${encoded}" \
            -f description="Click to preview the font from this PR" \
            -f context="Font preview"
